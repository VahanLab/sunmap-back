[package]
name = "helios-server"
version = "0.1.0"
edition = "2021"
description = "Serveur de query ensoleillement : /sunlit sur DSM Mapterhorn + helios-core."

[dependencies]
helios-core = { path = "../helios-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
