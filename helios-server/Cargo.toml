[package]
name = "helios-server"
version = "0.1.0"
edition = "2021"
description = "Serveur de query ensoleillement : /sunlit sur DSM Mapterhorn + helios-core."

[dependencies]
helios-core = { path = "../helios-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# webp : décodage des tuiles DEM Mapterhorn. png : encodage des tuiles de
# canopée servies au client (`/canopy/{z}/{x}/{y}`).
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
serde = { version = "1", features = ["derive"] }
# Vérification des jetons d'identité Firebase (JWT RS256). Les clés publiques
# viennent de Google au format JWK, d'où `from_rsa_components`.
jsonwebtoken = "9"

serde_json = "1"
# Charge `.env` au démarrage. Les secrets (jeton OSM, base de données) restent
# ainsi hors de l'historique du shell et de la liste des processus, où une
# variable passée en ligne de commande serait lisible par tout le monde.
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
# PostGIS : la géométrie OSM vit en base, Overpass n'est plus sur le chemin
# d'une requête client. `sqlx` en requêtes non vérifiées à la compilation
# (pas de macro `query!`) pour ne pas exiger une base joignable au build.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros",
    # `timestamptz` → `chrono::DateTime<Utc>`, pour dater les contributions
    # affichées sur un profil.
    "chrono",
    # Migrations embarquées dans le binaire (`sqlx::migrate!`), appliquées au
    # démarrage : un déploiement ne peut pas oublier une évolution de schéma.
    "migrate",
] }
