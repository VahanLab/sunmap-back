# Déploiement VM OVH : l'API + le proxy qui la publie.
#
# La base de données n'est PAS ici : PostgreSQL managé OVH (avec PostGIS),
# joint par `DATABASE_URL` — cf. `.env` (copier `.env.example`).
#
#   docker compose up -d --build
#
# Premier lancement : configurer Nginx Proxy Manager sur http://<vm>:81
# (admin@example.com / changeme), cf. docs/deploiement-ovh.md.

services:
  api:
    # En production, l'image vient de GHCR : elle est construite par GitHub
    # Actions à chaque push sur `main`, et `.env` porte le tag déployé (SHA du
    # commit) — épingler plutôt que `latest` rend le rollback trivial : remettre
    # l'ancien `API_TAG` dans `.env`, `docker compose up -d api`.
    image: ${API_IMAGE:-ghcr.io/vahanlab/sunmap-api}:${API_TAG:-latest}
    # Conservé pour le build local (`docker compose up -d --build`), qui
    # reconstruit l'image sous ce même nom sans passer par le registre.
    build: .
    restart: unless-stopped
    environment:
      # postgres://user:mdp@hôte-ovh:5432/sunmap?sslmode=require
      DATABASE_URL: ${DATABASE_URL}
      # Tuiles bâtiments (format HBT, cf. docs/deploiement-ovh.md §4).
      # Vide ou absent : lecture PostGIS classique — c'est le rollback.
      BUILDINGS_TILES: ${BUILDINGS_TILES:-}
      # Application OAuth 2 OpenStreetMap : c'est le serveur qui échange le
      # code et garde le jeton d'écriture, donc c'est lui qui a besoin de ces
      # deux valeurs. Vides : la liaison OSM est éteinte, pas cassée.
      OSM_CLIENT_ID: ${OSM_CLIENT_ID:-}
      OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET:-}
      # Cible OSM. Vides, l'image étant construite en `--release`, le serveur
      # vise la PRODUCTION. Renseigner le bac à sable
      # (https://master.apis.dev.openstreetmap.org, API et pages OAuth sur le
      # même hôte) pour un déploiement de recette.
      OSM_API_BASE: ${OSM_API_BASE:-}
      OSM_WEB_BASE: ${OSM_WEB_BASE:-}
    volumes:
      # Fichiers de tuiles générés par `tilebuild`, sur le disque de la VM —
      # gros (Go), statiques, rien à faire dans une image ou un volume nommé.
      - ./tiles:/tiles
    # Pas de port publié sur l'hôte : seul le proxy parle à l'API, via le
    # réseau compose interne (`http://api:8080`). Exposer 8080 en direct
    # contournerait le TLS et le rate limiting du proxy.
    expose:
      - "8080"

  # Nginx Proxy Manager : reverse proxy avec interface web — création des
  # hôtes (api.<domaine> → api:8080), certificats Let's Encrypt gérés et
  # renouvelés automatiquement, redirections HTTP → HTTPS.
  proxy:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP (challenges Let's Encrypt + redirection HTTPS)
      - "443:443"  # HTTPS public
      - "81:81"    # Interface d'admin — à restreindre par pare-feu OVH
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
