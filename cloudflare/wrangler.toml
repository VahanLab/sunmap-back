# Worker qui sert les tuiles de `sunmap.pmtiles` en URL `/{name}/{z}/{x}/{y}.mvt`.
#
# Le bucket R2 n'a PAS besoin d'être public : le Worker y accède par le
# binding ci-dessous (interne à Cloudflare), pas par HTTP. C'est ce qui permet
# de retirer le domaine custom du bucket et de le repasser en privé.
#
# Déploiement : cf. cloudflare/README.md.

name = "sunmap-tiles"
main = "src/index.ts"
compatibility_date = "2024-09-02"
minify = false

[[r2_buckets]]
# Alias lu par le Worker (`env.BUCKET`).
binding = "BUCKET"
bucket_name = "sunmap-tiles"
# Bucket visé par `wrangler dev`. Le même faute d'un bucket de recette : la
# géométrie est de l'open data, rien de sensible à isoler.
preview_bucket_name = "sunmap-tiles"

# Domaine servant les tuiles. Le domaine custom a été retiré du bucket R2 au
# préalable : Cloudflare refuse que le bucket et le Worker revendiquent le
# même nom d'hôte (cf. README, § « Libérer le domaine »).
[[routes]]
pattern = "tiles.sunmap.tech"
custom_domain = true

[vars]
# CORS. `*` convient : les tuiles sont de l'open data OSM, et l'app native
# ne passe de toute façon pas par CORS. À restreindre si un site web devient
# le principal consommateur.
ALLOWED_ORIGINS = "*"

# Durée de cache d'une tuile au bord (défaut du Worker : 1 jour).
# La géométrie ne bouge qu'au réimport, mais le cache est indexé sur l'URL et
# ne se périme donc pas tout seul quand l'archive est remplacée : garder une
# valeur modeste, ou purger le cache après un upload.
# CACHE_CONTROL = "public, max-age=86400"

# `{name}` de l'URL → clé dans le bucket. Défaut : `{name}.pmtiles`, donc
# `/sunmap/14/8412/5844.mvt` lit `sunmap.pmtiles`. Ne rien mettre ici tant
# qu'on n'a qu'une archive.
# PMTILES_PATH = "{name}.pmtiles"
